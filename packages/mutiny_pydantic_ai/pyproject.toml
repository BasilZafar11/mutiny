[project]
name = "mutiny-pydantic-ai"
version = "0.2.0"
description = "Mutiny TargetAdapter for local PydanticAI agents"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "mutiny-core>=0.2.0",
    "pydantic-ai-slim>=2.61.0,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mutiny_pydantic_ai"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/README.md", "/pyproject.toml"]
