# This is an unversioned workspace, not an installable product distribution.
[dependency-groups]
dev = [
    "mutiny-core",
    "mutiny-openai-agents",
    "mutiny-pydantic-ai",
    "mutiny-ai",
    "demo-agent",
    "mutiny-api",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff==0.17.0",
]
llm = [
    "mutiny-core[llm]",
]

[tool.uv.sources]
mutiny-core = { workspace = true }
mutiny-openai-agents = { workspace = true }
mutiny-pydantic-ai = { workspace = true }
mutiny-ai = { workspace = true }
demo-agent = { workspace = true }
mutiny-api = { workspace = true }

[tool.uv.workspace]
members = [
    "packages/mutiny_core",
    "packages/mutiny_openai_agents",
    "packages/mutiny_pydantic_ai",
    "packages/mutiny_cli",
    "apps/demo_agent",
    "apps/api",
]

[tool.ruff]
required-version = "==0.17.0"
target-version = "py311"

[tool.ruff.lint]
# Initial correctness gate; unused-import/style cleanup is separate from #76.
select = ["E9", "F63", "F7", "F82"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [
    "packages/mutiny_core/src",
    "packages/mutiny_openai_agents/src",
    "packages/mutiny_pydantic_ai/src",
    "packages/mutiny_cli/src",
    "apps/demo_agent/src",
    "apps/api/src",
    "examples/openai_support_agent",
]
asyncio_mode = "auto"
